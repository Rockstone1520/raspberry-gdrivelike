<!doctype html>
<html lang="es" data-theme="niebla">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f9">
  <title>Nube</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233b6cf6' d='M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 9.5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"niebla"}catch(e){}</script>
  <script src="/js/app.js" defer></script>
</head>
<body>

  <!-- ============ Login ============ -->
  <main id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand"><i data-icon="cloud"></i><span>Nube</span></div>
      <p class="muted">Inicia sesión para ver tus archivos.</p>
      <label class="field">Usuario
        <input id="login-user" name="username" autocomplete="username" autocapitalize="none" required>
      </label>
      <label class="field">Contraseña
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="error" role="alert"></div>
      <button class="btn primary block" type="submit">Entrar</button>
    </form>
  </main>

  <!-- ============ App ============ -->
  <div id="app" class="app hidden">
    <div class="backdrop" id="backdrop"></div>

    <aside class="sidebar" aria-label="Navegación">
      <div class="brand"><i data-icon="cloud"></i><span>Nube</span></div>

      <nav class="nav">
        <a class="nav-item active" href="#/"><i data-icon="folder"></i><span>Mis archivos</span></a>
      </nav>

      <div class="grow"></div>

      <section class="storage" aria-label="Almacenamiento">
        <div class="meter" id="meter"><i></i></div>
        <div class="muted small" id="meter-text">—</div>
      </section>

      <section class="themes" aria-label="Tema">
        <span class="small muted">Tema</span>
        <div class="swatches">
          <button class="swatch" data-theme="papel"  title="Papel"  aria-label="Tema Papel"></button>
          <button class="swatch" data-theme="niebla" title="Niebla" aria-label="Tema Niebla"></button>
          <button class="swatch" data-theme="menta"  title="Menta"  aria-label="Tema Menta"></button>
          <button class="swatch" data-theme="noche"  title="Noche"  aria-label="Tema Noche"></button>
        </div>
      </section>

      <div class="user">
        <span class="avatar" id="avatar">?</span>
        <span class="user-name" id="user-name"></span>
        <button class="icon-btn" id="logout" title="Cerrar sesión" aria-label="Cerrar sesión"><i data-icon="logout"></i></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menu-btn" aria-label="Menú"><i data-icon="menu"></i></button>
        <label class="search">
          <i data-icon="search"></i>
          <input id="search" type="search" placeholder="Buscar en esta carpeta" autocomplete="off">
        </label>
        <button class="icon-btn" id="view-btn" title="Cambiar vista" aria-label="Cambiar vista"><i data-icon="grid"></i></button>
        <button class="btn" id="new-folder"><i data-icon="newfolder"></i><span class="lbl">Nueva carpeta</span></button>
        <button class="btn primary" id="upload-btn"><i data-icon="upload"></i><span class="lbl">Subir</span></button>
        <input id="file-input" type="file" multiple hidden>
      </header>

      <nav id="crumbs" class="crumbs" aria-label="Ruta"></nav>

      <section id="files" class="files view-list"></section>

      <div id="empty" class="empty" hidden>
        <i data-icon="cloud"></i>
        <p id="empty-text">Esta carpeta está vacía</p>
        <p class="muted small">Arrastra archivos aquí o pulsa «Subir».</p>
      </div>
    </main>

    <!-- Panel de subidas -->
    <aside id="uploads" class="uploads" hidden aria-live="polite">
      <header>
        <strong id="uploads-title">Subidas</strong>
        <button class="icon-btn" id="uploads-clear" title="Limpiar terminadas" aria-label="Limpiar terminadas"><i data-icon="x"></i></button>
      </header>
      <ul id="uploads-list"></ul>
    </aside>
  </div>

  <div id="dropveil" class="dropveil"><div><i data-icon="upload"></i><p>Suelta para subir aquí</p></div></div>
  <div id="toasts" class="toasts"></div>

  <dialog id="dlg">
    <form method="dialog">
      <h2 id="dlg-title"></h2>
      <p id="dlg-msg" class="muted"></p>
      <input id="dlg-input" class="dlg-input" autocomplete="off" spellcheck="false">
      <div class="dlg-actions">
        <button class="btn primary" id="dlg-ok" value="ok">Aceptar</button>
        <button class="btn" value="cancel" formnovalidate>Cancelar</button>
      </div>
    </form>
  </dialog>

</body>
</html>
